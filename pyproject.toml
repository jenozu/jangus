[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jangus"
version = "0.1.0"
description = "Local-first agent system: verified deterministic file execution."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
jangus = "jangus.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jangus"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/config", "/scripts", "/docs", "/README.md", "/AGENTS.md", "/rules.md", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.uv]
required-version = "==0.12.23"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/jangus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
